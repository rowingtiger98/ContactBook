; PHP settings for ContactBook on Bluehost (read by PHP for this folder and below).
; Each photo can be up to 10 MB (BOOK_PHOTO_MAX_BYTES in bookFunctions.php), and an
; entry can have up to 5 (ENTRY_PHOTOS_MAX_COUNT in entryFunctions.php).
; post_max_size must fit all of them plus the rest of the form.
upload_max_filesize = 10M
post_max_size = 55M
max_file_uploads = 20
; Resizing a large photo needs roughly 4 bytes per pixel.
memory_limit = 256M
